name: Build Bid to Finish APK

# Builds a signed release APK on every version tag (v1.0.0, v1.1.0, ...),
# and a debug APK on manual runs. No secrets are stored in this repo:
# signing comes from the four repo secrets listed in the README.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-android-apk:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # KEYSTORE_BASE64 is set at job level (not step level) because the
    # steps below test it in their `if:` conditions, and step-level env
    # is not visible to `if:`.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - run: npm ci
      - run: npm run build

      # App icon from assets/icon.svg (same pattern as AutoHustle).
      - run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          RES_DIR="android/app/src/main/res"
          declare -A SIZES=( ["mipmap-mdpi"]=48 ["mipmap-hdpi"]=72 ["mipmap-xhdpi"]=96 ["mipmap-xxhdpi"]=144 ["mipmap-xxxhdpi"]=192 )
          for DIR in "${!SIZES[@]}"; do
            mkdir -p "$RES_DIR/$DIR"
            convert -background none assets/icon.svg -resize "${SIZES[$DIR]}x${SIZES[$DIR]}" "$RES_DIR/$DIR/ic_launcher.png"
            convert -background none assets/icon.svg -resize "${SIZES[$DIR]}x${SIZES[$DIR]}" "$RES_DIR/$DIR/ic_launcher_round.png"
          done

      - run: npx cap sync android

      # Signed release build when the four signing secrets are set.
      # The keystore must be a NEW one made for this app (see README) —
      # never reuse another app's keystore.
      - name: Build signed release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/carpentry-release.keystore
          printf 'storeFile=carpentry-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
          cd android && chmod +x gradlew && ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../BidToFinish.apk
          rm -f app/carpentry-release.keystore ../android/keystore.properties
          echo "Signed release APK ready: BidToFinish.apk"

      # Fallback when the signing secrets are not set yet: an unsigned
      # debug APK so the run still hands back something installable.
      - name: Build debug APK (no signing secrets set)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../BidToFinish-debug.apk
          echo "No signing secrets set; handing back debug APK: BidToFinish-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BidToFinish-APK
          path: |
            BidToFinish.apk
            BidToFinish-debug.apk
          if-no-files-found: error

      # GitHub Release on tags, with the APK attached.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BidToFinish.apk
            BidToFinish-debug.apk
          fail_on_unmatched_files: false
          generate_release_notes: true
